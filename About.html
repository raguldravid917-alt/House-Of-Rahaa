<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Rahaa House</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img13.jpg">
    
 


  <style>
  :root {
    /* Main theme colors */
    --primary-pink: #ee4266;
    --secondary-purple: #7b2ff7;
    --highlight-blue: #2193b0;
    --light-gray: #f4f4f9;
    --dark-gray: #2e2e3a;
    --shadow-color: #b29cd9;

    /* EXTRA: variables that you used but didn't define */
    --primary-color: #ee4266; /* buttons / headings */
    --secondary-color: #2193b0; /* gradients, accents */
    --card-gradient: linear-gradient(135deg, #ffffff, #e3f2fd); /* light card bg */
    --text-color: #1f2933; /* dark readable text */
    --white: #ffffff;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    /* light neutral bg so text stands out */
    background: var(--light-gray);
    color: var(--dark-gray);
    line-height: 1.7;
  }

  h1,
  h2,
  h3,
  h4 {
    font-weight: 700;
    letter-spacing: 1.1px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 2.8em;
    color: var(--primary-pink);
    text-shadow: 1px 1px 3px var(--shadow-color);
    text-align: center;
    margin-top: 40px;
  }

  h2 {
    color: var(--secondary-purple);
    font-size: 2.1em;
    margin-top: 32px;
    text-align: center;
  }

  p {
    font-size: 1.12em;
    margin-bottom: 22px;
    color: var(--dark-gray);
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  strong {
    color: var(--primary-pink);
    font-weight: 700;
  }

  em {
    color: var(--highlight-blue);
    font-style: italic;
    font-weight: 600;
  }

  ul {
    list-style-type: square;
    padding-left: 40px;
    max-width: 700px;
    margin: 20px auto 30px auto;
  }

  li {
    margin-bottom: 12px;
    font-weight: 600;
    color: var(--secondary-purple);
  }

  a {
    color: var(--primary-pink);
    text-decoration: none;
    font-weight: 700;
  }
  a:hover,
  a:focus {
    text-decoration: underline;
    color: var(--highlight-blue);
  }

  blockquote {
    border-left: 5px solid var(--secondary-purple);
    background: #f0e8ff;
    padding: 18px 22px;
    margin: 30px auto;
    max-width: 700px;
    font-size: 1.1em;
    color: var(--secondary-purple);
    font-style: italic;
    box-shadow: 0 4px 12px var(--shadow-color);
  }

  header {
    background: linear-gradient(
      90deg,
      var(--primary-color) 0%,
      var(--secondary-color) 100%
    );
    padding: 10px 0;
    text-align: center;
    color: var(--white);
    box-shadow: 0 2px 18px var(--shadow-color);
  }

  nav {
    margin-top: 20px;
  }

  nav a {
    color: var(--white);
    text-decoration: none;
    margin: 0 18px;
    font-weight: bold;
    border-radius: 7px;
    padding: 7px 13px;
    letter-spacing: 1px;
    font-size: 1.14em;
    transition: background 0.2s, color 0.2s;
  }

  nav a:hover {
    background: #eaf6fc;
    color: var(--primary-color);
  }

  .about-title {
    text-align: center;
    font-size: 2.3em;
    color: var(--primary-color);
    font-weight: bold;
    margin: 38px 0 10px;
    letter-spacing: 1.2px;
    text-shadow: 0 2px 10px var(--secondary-color);
  }

  .about-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 9vw 38px;
    flex-wrap: wrap;
  }

  .about-card {
    background: var(--card-gradient); /* light card, dark text */
    border-radius: 13px;
    box-shadow: 0 2px 22px var(--shadow-color);
    padding: 38px 35px;
    max-width: 620px;
    width: 100%;
    margin: 12px;
    box-sizing: border-box;
  }

  .about-headline {
    color: var(--secondary-color);
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 18px;
    letter-spacing: 0.8px;
  }

  .about-text {
    color: var(--text-color); /* high-contrast text */
    font-size: 1.08em;
    margin-bottom: 18px;
    line-height: 1.7;
  }

  .about-list {
    color: var(--primary-color);
    font-size: 1em;
    font-weight: bold;
    margin: 22px 0 16px;
  }

  .about-list ul {
    padding-left: 22px;
    margin: 0;
  }

  .about-list li {
    padding: 4px 0;
    color: var(--text-color);
  }

  footer {
    background: linear-gradient(
      90deg,
      var(--secondary-color) 0%,
      var(--primary-color) 100%
    );
    color: var(--white);
    text-align: center;
    padding: 26px 0 18px;
    font-size: 1.07em;
    margin-top: 32px;
    border-radius: 40px 40px 0 0;
    box-shadow: 0 -3px 22px #8ab6e570;
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    .about-section {
      flex-direction: column;
      padding: 20px 12px;
    }
    .about-card {
      max-width: 100%;
      margin: 12px 0;
    }
  }
</style>
