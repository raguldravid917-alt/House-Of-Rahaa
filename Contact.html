    <style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', 'Arial', sans-serif;
  background: linear-gradient(120deg, #ffecd2 0%, #fcb69f 100%);
  color: #222;
}
header {
  background: linear-gradient(90deg, #f857a6 0%, #ff5858 100%);
  padding: 28px 0 18px 0;
  text-align: center;
  color: #fff;
  box-shadow: 0 2px 16px #ee4c8a22;
}
nav {
  margin: 20px 0 0 0;
}
nav a {
  color: #fff;
  text-decoration: none;
  margin: 0 18px;
  font-weight: bold;
  border-radius: 7px;
  padding: 7px 12px;
  letter-spacing: 1px;
  font-size: 1.14em;
  transition: background 0.2s, color 0.2s;
}
nav a:hover {
  background: #fff3e0;
  color: #f857a6;
}
.contact-title {
  text-align: center;
  font-size: 2em;
  color: #f857a6;
  font-weight: bold;
  margin-top: 32px;
  letter-spacing: 1px;
  margin-bottom: 30px;
  text-shadow: 0 2px 8px #ffecd230;
}
.contact-form-container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 0 50px 0;
}
.contact-form-box {
  background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
  border-radius: 18px;
  box-shadow: 0 2px 22px #a6c1ee60;
  padding: 30px 30px 24px 30px;
  min-width: 340px;
  max-width: 420px;
  width: 100%;
}
.contact-form-box h2 {
  color: #f857a6;
  font-size: 1.25em;
  margin-bottom: 20px;
  letter-spacing: 0.5px;
  font-weight: bold;
  text-align:center;
}
label {
  color: #f857a6;
  font-weight: bold;
  font-size: 1em;
  display: block;
  margin-bottom: 6px;
  margin-top: 14px;
}
input, textarea {
  width: 98%;
  margin-bottom: 16px;
  padding: 10px;
  border: 2px solid #fbc2eb;
  border-radius: 7px;
  background: #fff9f3;
  font-size: 1em;
  color: #222;
  transition: border 0.19s, background 0.22s;
}
input:focus, textarea:focus {
  outline: none;
  border: 2px solid #f857a6;
  background: #fff;
}
button[type="submit"] {
  background: linear-gradient(110deg, #f857a6 80%, #ff5858 100%);
  color: #fff;
  font-weight: bold;
  padding: 12px 32px;
  border: none;
  border-radius: 10px;
  font-size: 1.06em;
  cursor: pointer;
  transition: background 0.2s;
  box-shadow: 0 2px 18px #f857a640;
}
button[type="submit"]:hover {
  background: linear-gradient(110deg, #ff5858 70%, #f857a6 100%);
  color: #f857a6;
}
.contact-info-box {
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  border-radius: 16px;
  box-shadow: 0 2px 22px #a6c1ee30;
  margin-left: 38px;
  padding: 30px 22px 24px 22px;
  min-width: 240px;
  max-width: 360px;
  width: 100%;
  color: #222;
}
.contact-info-title {
  color: #f857a6;
  font-size: 1.18em;
  font-weight: bold;
  margin-bottom: 18px;
  letter-spacing:.7px;
}
.contact-info-text {
  color: #333;
  font-size: 1em;
  margin-bottom: 18px;
}
footer {
  background: linear-gradient(90deg, #ff5858 0%, #f857a6 100%);
  color: #fff;
  text-align: center;
  padding: 26px 0 18px 0;
  font-size: 1.07em;
  margin-top: 32px;
  border-radius: 40px 40px 0 0;
  box-shadow: 0 -3px 22px #fcc27970;
}
@media (max-width:900px){
  .contact-form-container{flex-direction: column; align-items: center;padding:10px 0 14px 0;}
  .contact-info-box{margin-left:0; margin-top:28px;}
}
</style>
<style>
          body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
          }
          form {
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            background: #222;
            border-radius: 8px;
          }
          label {
            display: block;
            margin-top: 15px;
          }
          input,
          textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: none;
          }
          button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: aquamarine;
            border: none;
            cursor: pointer;
            font-weight: bold;
          }
          button:hover {
            background-color: mediumturquoise;
          }
          .success-message {
            color: lightgreen;
            margin-top: 15px;
            text-align: center;
          }
        </style>
  </head>
  <body>
    <header class="header">
      <div class="logo-title">
        <img src="img13.jpg" alt="Rahaa Housing Logo" class="logo" />
        <h1 style="color: white">House Of Rahaa</h1>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="Services.html">Services</a>
        <a href="Gallery.html">Gallery</a>
        <a href="Contact.html">Contact</a>
        <a href="About.html">About</a>
      </nav>
    </header>
    <!-- Contact Section -->
      <body>
        <h1 style="color: rgb(23, 138, 102); text-align: center">
          Contact House Of Rahaa
        </h1>

        <form id="contactForm">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Your Name"
          />

          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="you@example.com"
          />

          <label for="message">Message *</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            required
            placeholder="Your message here"
          ></textarea>

          <button type="submit">Send Message</button>

          <div
            class="success-message"
            id="successMessage"
            style="display: none"
          >
            Thank you for contacting us! We will get back to you soon.
          </div>
        </form>

        <script>
          document
            .getElementById("contactForm")
            .addEventListener("submit", async function (e) {
              e.preventDefault();

              // Gather form data
              const formData = {
                name: e.target.name.value.trim(),
                email: e.target.email.value.trim(),
                message: e.target.message.value.trim(),
              };

              // Simple validation (already required fields are enforced)
              if (!formData.name || !formData.email || !formData.message) {
                alert("Please fill out all fields.");
                return;
              }

              try {
                // Simulate sending data to server (replace with real API endpoint)
                await new Promise((resolve) => setTimeout(resolve, 1000));

                // Show success message
                document.getElementById("successMessage").style.display =
                  "block";
                e.target.reset();
              } catch (err) {
                alert("Failed to send message. Please try again later.");
              }
            });
        </script>
      </body>
    </html>
  </body>
